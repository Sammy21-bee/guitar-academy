name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - sammy21-bee-make-site-public
  workflow_dispatch:
    inputs:
      preview:
        description: "Include the unlisted local trainer preview"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage public site
        run: |
          mkdir -p _site
          if [ "${{ inputs.preview }}" = "true" ]; then
            rsync -a --exclude='/.git/' --exclude='/_site/' ./ _site/
          else
            rsync -a --exclude='/.git/' --exclude='/local/' --exclude='/_site/' ./ _site/
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
