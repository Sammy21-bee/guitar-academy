<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Area Cliente — Damiano Tropea PT</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="assets/css/gestionale.css">
</head>
<body>

<div class="wrap">
  <header class="g-header no-print">
    <a class="g-brand" href="../index.html">
      <span class="g-brand-mark">DT</span>
      <span class="g-brand-text">Area Cliente<span class="g-brand-sub">Damiano Tropea · Personal Trainer</span></span>
    </a>
    <a class="g-top-link" href="../index.html">Torna al sito</a>
  </header>

  <!-- LOGIN -->
  <section id="login-screen" class="login-shell" style="min-height:50vh">
    <div class="card login-card">
      <h1>Accedi alla tua area</h1>
      <p>Questa demo pubblica è vuota e non contiene profili cliente.</p>
      <div id="login-msg"></div>
      <form id="login-form">
        <div class="field">
          <label for="login-pin">Password</label>
          <input id="login-pin" required maxlength="4" inputmode="numeric" pattern="\d{4}" placeholder="••••" style="text-align:center;letter-spacing:.4em;font-family:var(--font-display);font-size:1.3rem">
        </div>
        <button class="btn btn--primary" type="submit" style="width:100%">Entra</button>
      </form>
    </div>
  </section>

  <!-- DASHBOARD CLIENTE -->
  <section id="dashboard-screen" hidden>
    <div class="card card--tight no-print">
      <div class="btn-row" style="justify-content:space-between">
        <div id="welcome-msg" style="color:var(--txt)"></div>
        <div class="btn-row">
          <button class="btn btn--ghost btn--sm" id="btn-print">Stampa la mia scheda</button>
          <a class="btn btn--ghost btn--sm js-whatsapp" href="#" target="_blank" rel="noopener noreferrer">Scrivi a Damiano</a>
          <button class="btn btn--ghost btn--sm" id="btn-logout">Esci</button>
        </div>
      </div>
    </div>

    <div id="video-box"></div>

    <div class="grid-2">
      <div class="card">
        <h2>Il mio percorso</h2>
        <p id="c-obiettivo"></p>
        <div id="c-info"></div>
      </div>
      <div class="card">
        <h2>Abbonamento</h2>
        <div id="c-abbonamento"></div>
      </div>
    </div>

    <div class="card">
      <h2 id="c-prog-titolo">Scheda di allenamento</h2>
      <p id="c-prog-agg" style="font-size:.82rem"></p>
      <div id="c-giorni"></div>
      <p id="c-prog-note"></p>
    </div>

    <div class="card">
      <h2>Piano alimentare</h2>
      <div id="c-alim-macro"></div>
      <div id="c-alim-pasti" style="margin-top:10px"></div>
      <p id="c-alim-note" style="white-space:pre-line"></p>
    </div>

    <div class="card">
      <h2>Foto e progressi</h2>
      <div class="photo-grid" id="c-foto"></div>
    </div>
  </section>
</div>

<script src="data/clienti-demo.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/cliente.js"></script>
</body>
</html>
